version: "3.9"

services:
  db:
    image: postgres:16
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${ENV_PROTUBE_DB_USER:-admin}
      POSTGRES_PASSWORD: ${ENV_PROTUBE_DB_PASS:-password}
      POSTGRES_DB: ${ENV_PROTUBE_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Search index (US-08). Its data is rebuilt from Postgres, so no volume is needed.
  search:
    image: mongo:7
    container_name: mongo_search
    restart: always
    ports:
      - "27017:27017"

volumes:
  postgres_data:
