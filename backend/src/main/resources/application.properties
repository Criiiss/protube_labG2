spring.application.name=protube-back
server.port=8080
protube.auth.frontend-url=${ENV_PROTUBE_FRONTEND_URL:http://localhost:5173}
protube.auth.minimum-age=${ENV_PROTUBE_MINIMUM_AGE:13}
protube.auth.google-callback=${ENV_PROTUBE_GOOGLE_CALLBACK:http://localhost:8080/api/auth/google/callback}
protube.auth.mail-from=${ENV_PROTUBE_MAIL_FROM:no-reply@localhost}
spring.mail.host=${ENV_PROTUBE_SMTP_HOST:localhost}
spring.mail.port=${ENV_PROTUBE_SMTP_PORT:1025}
spring.mail.username=${ENV_PROTUBE_SMTP_USER:}
spring.mail.password=${ENV_PROTUBE_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${ENV_PROTUBE_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${ENV_PROTUBE_SMTP_TLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${ENV_PROTUBE_SECURE_COOKIES:false}
spring.thymeleaf.prefix=classpath:/static/

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.profiles.active=@spring.profiles.active@
spring.profiles.default=dev

# Before running the process you must have this system-level environment variable set: ENV_PROTUBE_STORE_DIR
# It must hold the absolute path to the directory containing the videos (and any other file-based storage)
pro_tube.store.dir=${ENV_PROTUBE_STORE_DIR}

spring.security.oauth2.client.registration.google.client-id=${ENV_PROTUBE_GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${ENV_PROTUBE_GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.provider.google.user-name-attribute=sub
spring.security.oauth2.client.provider.google.issuer-uri=https://accounts.google.com

#---
spring.config.activate.on-profile=dev
pro_tube.load_initial_data=true
spring.datasource.url=jdbc:h2:mem:mydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${ENV_PROTUBE_DB_USER:admin}
spring.datasource.password=${ENV_PROTUBE_DB_PASS:password}
spring.sql.init.platform=h2
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# The Flyway migrations are written for PostgreSQL; H2 keeps using ddl-auto
spring.flyway.enabled=false

#---
spring.config.activate.on-profile=prod
pro_tube.load_initial_data=false
# For a simpler approach you can reuse the h2 from dev (adjust other config properly)
# spring.datasource.url=jdbc:h2:mem:mydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.url=jdbc:postgresql://${ENV_PROTUBE_DB_HOST}:5432/${ENV_PROTUBE_DB}
spring.datasource.username=${ENV_PROTUBE_DB_USER:admin}
spring.datasource.password=${ENV_PROTUBE_DB_PASS:password}
spring.datasource.driver-class-name=org.postgresql.Driver
# Schema is owned by Flyway (db/migration/V*.sql); Hibernate only checks that entities match it
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate

spring.mvc.static-path-pattern=/media/**
logging.level.org.springframework.web=DEBUG


